<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mxlvin</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Inter',sans-serif;
background:#07152d;
background-image:
radial-gradient(circle at top,#1f4fa3 0%,transparent 45%),
linear-gradient(180deg,#08152d,#020617);
min-height:100vh;
display:flex;
justify-content:center;
padding:24px 18px;
color:white;
}

.container{
width:100%;
max-width:430px;
}

.hero{
position:relative;
overflow:hidden;
border-radius:30px;
box-shadow:0 25px 60px rgba(0,0,0,.45);
}

.hero img{
width:100%;
display:block;
aspect-ratio:4/5;
object-fit:cover;
}

.overlay{
position:absolute;
inset:0;
background:linear-gradient(to top,
rgba(2,6,23,.92) 8%,
rgba(2,6,23,.30) 55%,
rgba(2,6,23,.05));
display:flex;
align-items:flex-end;
padding:24px;
}

h1{
font-size:42px;
font-weight:800;
letter-spacing:-1px;
}

.tagline{
font-size:14px;
color:#dbeafe;
margin-top:4px;
}

.panel{
margin-top:18px;
background:rgba(255,255,255,.08);
backdrop-filter:blur(16px);
border:1px solid rgba(255,255,255,.08);
border-radius:24px;
padding:18px;
}

.quote{
text-align:center;
font-size:15px;
line-height:1.6;
color:#dbeafe;
margin-bottom:18px;
}

.btn{
display:flex;
justify-content:space-between;
align-items:center;
padding:16px 18px;
margin:12px 0;
border-radius:18px;
text-decoration:none;
font-weight:600;
transition:.18s;
}

.btn:hover{
transform:translateY(-2px);
}

.left{
display:flex;
align-items:center;
gap:14px;
}

.icon{
font-size:22px;
}

.ig{
background:#E1306C;
color:white;
}

.wa{
background:#25D366;
color:#052e16;
}

.mail{
background:rgba(255,255,255,.08);
border:1px solid rgba(255,255,255,.08);
color:white;
}

.arrow{
font-size:18px;
opacity:.75;
}

.footer{
margin-top:18px;
text-align:center;
font-size:12px;
letter-spacing:.8px;
color:#94a3b8;
}
</style>

</head>
<body>

<div class="container">

<div class="hero">

<img src="1002467138.jpg" alt="Mxlvin">

<div class="overlay">

<div>
<h1>Mxlvin</h1>
<div class="tagline">Create • Perform • Connect</div>
</div>

</div>

</div>

<div class="panel">

<div class="quote">
Music is how I translate moments into memories.
</div>

<a class="btn ig"
href="https://www.instagram.com/sir.mxlvin?igsi=MWkxYTY4djZ5NW03OA==">

<div class="left">
<div class="icon">📸</div>
<div>Instagram</div>
</div>

<div class="arrow">↗</div>

</a>

<a class="btn wa"
href="https://wa.me/263778690204">

<div class="left">
<div class="icon">💬</div>
<div>Book / Collaborate</div>
</div>

<div class="arrow">↗</div>

</a>

<a class="btn mail"
href="mailto:zanzamelvin@gmail.com">

<div class="left">
<div class="icon">✉️</div>
<div>Official Enquiries</div>
</div>

<div class="arrow">↗</div>

</a>

</div>

<div class="footer">
© MXLVIN
</div>

</div>

</body>
</html>
