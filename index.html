
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mxlvin</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:#060B16;
  font-family:'Inter',sans-serif;
  color:#F8FAFC;
  min-height:100vh;
  display:flex;
  justify-content:center;
  padding:24px 18px;
}

.container{
  width:100%;
  max-width:430px;
}

.hero{
  position:relative;
  overflow:hidden;
  border-radius:28px;
  box-shadow:0 30px 80px rgba(0,0,0,.55);
}

.hero img{
  width:100%;
  aspect-ratio:4/5;
  object-fit:cover;
  display:block;
}

.hero::after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(
    to top,
    rgba(5,8,15,.95) 8%,
    rgba(5,8,15,.35) 45%,
    rgba(5,8,15,.08)
  );
}

.heroText{
  position:absolute;
  left:24px;
  bottom:22px;
  z-index:2;
}

.name{
  font-family:'Cormorant Garamond',serif;
  font-size:52px;
  line-height:.9;
  letter-spacing:.5px;
  color:white;
}

.role{
  margin-top:8px;
  font-size:13px;
  color:#CBD5E1;
  letter-spacing:2px;
  text-transform:uppercase;
}

.panel{
  margin-top:18px;
  border:1px solid rgba(255,255,255,.08);
  background:rgba(255,255,255,.04);
  backdrop-filter:blur(18px);
  border-radius:24px;
  padding:22px;
}

.quote{
  text-align:center;
  color:#E2E8F0;
  font-weight:300;
  line-height:1.7;
  font-size:15px;
  margin-bottom:20px;
}

.button{
  display:flex;
  align-items:center;
  justify-content:space-between;
  text-decoration:none;
  padding:16px 18px;
  border-radius:18px;
  margin:12px 0;
  transition:.18s ease;
}

.button:hover{
  transform:translateY(-2px);
}

.left{
  display:flex;
  align-items:center;
  gap:14px;
}

.icon{
  width:24px;
  height:24px;
  flex-shrink:0;
}

.label{
  font-weight:600;
  font-size:16px;
}

.sub{
  font-size:12px;
  margin-top:2px;
}

.arrow{
  font-size:18px;
  opacity:.72;
}

/* Instagram */

.ig{
  background:linear-gradient(135deg,#833AB4,#E1306C,#F77737);
  color:white;
}

.ig .sub{
  color:rgba(255,255,255,.88);
}

/* WhatsApp */

.wa{
  background:#25D366;
  color:white;
}

.wa .label{
  color:white;
}

.wa .sub{
  color:rgba(255,255,255,.92);
}

.wa .arrow{
  color:white;
}

/* Email */

.mail{
  background:#111827;
  border:1px solid rgba(255,255,255,.06);
  color:white;
}

.mail .sub{
  color:#CBD5E1;
}

.footer{
  margin-top:18px;
  text-align:center;
  color:#94A3B8;
  font-size:12px;
  letter-spacing:1px;
}
</style>
</head>
